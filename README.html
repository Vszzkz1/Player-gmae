<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⚽ تحدي التخمين 1v1</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #0d1117;
  color: white;
}
button {
  padding: 12px;
  font-size: 18px;
  margin: 10px;
}
input {
  padding: 10px;
  font-size: 16px;
}
</style>
</head>
<body>

<h1>🔥 تحدي التخمين 1v1</h1>

<input id="room" placeholder="اكتب كود الغرفة">
<br>
<button onclick="join()">دخول</button>

<div id="game" style="display:none;">
<button onclick="start()">🎲 ابدأ</button>
<h2 id="result">...</h2>
</div>

<script>
// 🔴 حط بيانات Firebase هنا (بعطيك طريقة تحت)
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔥 +50 لاعب
const players = [
"سالم الدوسري","سعود عبدالحميد","محمد كنو","سلمان الفرج",
"فراس البريكان","عبدالرزاق حمدالله","ياسر الشهراني",
"علي البليهي","حسان تمبكتي","عبدالإله العمري",
"رياض محرز","كريستيانو رونالدو","كريم بنزيما","نيمار",
"ساديو ماني","مالكوم","ميتروفيتش","سيرجي ميلينكوفيتش",
"روبن نيفيز","كوليبالي","ميسي","مبابي","هالاند",
"دي بروين","محمد صلاح","فينيسيوس","بيلينغهام",
"هاري كين","ليفاندوفسكي","غريزمان","رودري","برناردو سيلفا",
"رافينيا","ديمبلي","بيدري","تشواميني","كامافينغا",
"ماركينيوس","دوناروما","كورتوا","تير شتيغن",
"ألفونسو ديفيز","أشرف حكيمي","جواو كانسيلو",
"لوكا مودريتش","توني كروس","ديبالا","لاوتارو",
"أوسيمين","كفاراتسخيليا"
];

let roomId = "";
let myId = Math.random().toString(36).substring(7);

function join() {
  roomId = document.getElementById("room").value;

  db.collection("rooms").doc(roomId).set({
    players: firebase.firestore.FieldValue.arrayUnion(myId)
  }, {merge:true});

  document.getElementById("game").style.display = "block";
}

async function start() {
  const myPlayer = players[Math.floor(Math.random() * players.length)];

  await db.collection("rooms").doc(roomId).set({
    [myId]: myPlayer
  }, {merge:true});

  setTimeout(async () => {
    const doc = await db.collection("rooms").doc(roomId).get();
    const data = doc.data();

    const enemy = Object.keys(data).find(k => k !== myId && k !== "players");

    if (enemy) {
      document.getElementById("result").innerText =
        "👀 لاعب خصمك: " + data[enemy];
    } else {
      document.getElementById("result").innerText =
        "⌛ بانتظار اللاعب الثاني...";
    }
  }, 2000);
}
</script>

</body>
</html>
